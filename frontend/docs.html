<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Alimenti API — Documentazione</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
<style>
  body { margin: 0; background: #FBF8EE; }
  .topbar { background: #2B2318 !important; }
  #back-link {
    display: block; padding: 10px 20px; font-family: 'IBM Plex Sans', sans-serif;
    background: #2B2318; color: #F3EEDD; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>
  <a id="back-link" href="/">&larr; Torna all'applicazione</a>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "/api/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    };
  </script>
</body>
</html>
